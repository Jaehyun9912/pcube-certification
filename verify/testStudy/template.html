<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{EARNER_NAME}}님의 수료 배지 인증</title>

    <meta property="og:title" content="{{EARNER_NAME}}님의 {{STUDY_NAME}} 수료 배지" />
    <meta property="og:description" content="공식 인증된 교육 과정 수료 배지입니다. (발급번호: {{BADGE_ID}})" />
    <meta property="og:image" content="{{BADGE_IMAGE_URL}}" />
    <meta property="og:type" content="website" />

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-success: #10b981;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            /* 👇 배경 이미지 치환자 추가 (패턴이나 전체 배경) */
            background-image: url('{{BACKGROUND_IMAGE_URL}}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .card {
            /* 배경 이미지가 있을 때 글독성을 위해 카드 배경을 95% 불투명한 흰색으로 설정 */
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px); /* 뒤 배경을 살짝 흐리게 */
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 36px 24px;
            text-align: center;
            position: relative; /* 도장 절대 위치(Absolute)의 기준점이 됨 */
            overflow: hidden;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ecfdf5;
            color: var(--accent-success);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }

        .badge-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 24px auto;
            display: block;
            position: relative;
            z-index: 2;
        }

        .study-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-main);
            word-break: keep-all;
            position: relative;
            z-index: 2;
        }

        .earner-info {
            font-size: 15px;
            color: var(--text-sub);
            margin: 0 0 32px 0;
            position: relative;
            z-index: 2;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 2;
        }

        .info-table th, .info-table td {
            padding: 14px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-table th {
            color: var(--text-sub);
            font-weight: 500;
            width: 30%;
        }

        .info-table td {
            color: var(--text-main);
            font-weight: 600;
        }

        .footer {
            margin-top: 36px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }

        /* 👇 인증 도장 이미지 스타일 */
        .stamp-image {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: auto;
            opacity: 0.75;
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="status-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                인증 완료
            </div>

            <img class="badge-image" src="{{BADGE_IMAGE_URL}}" alt="{{STUDY_NAME}} 배지">

            <h1 class="study-title">{{STUDY_NAME}}</h1>
            <p class="earner-info">{{EARNER_NAME}} 수료자</p>

            <table class="info-table">
                <tr>
                    <th>발급 번호</th>
                    <td>{{BADGE_ID}}</td>
                </tr>
                <tr>
                    <th>발급 일자</th>
                    <td>{{ISSUE_DATE}}</td>
                </tr>
                <tr>
                    <th>인증 기관</th>
                    <td>동아리 이름</td>
                </tr>
            </table>

            <div class="footer">
                VERIFIED BY Vent Badge Infra.
            </div>

            <img class="stamp-image" src="/pcube-symbol.png" alt="인증 도장">
        </div>
    </div>

</body>
</html>
